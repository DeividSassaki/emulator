<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>AR - Zelda</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- =====================================================
         ÁREA DA CÂMERA
    ====================================================== -->

    <div class="example-container">

        <a-scene
            id="scene"

            mindar-image="
                imageTargetSrc: ./marcadores/zelda/targets.mind;
                autoStart: true;
                missTolerance: 20;
                filterMinCF: 0.0001;
                filterBeta: 1000;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
            "

            embedded

            color-space="sRGB"

            renderer="
                alpha: true;
                colorManagement: true;
                physicallyCorrectLights: true;
            "

            vr-mode-ui="enabled: false"

            device-orientation-permission-ui="enabled: false"
        >

            <!-- =================================================
                 CÂMERA
            ================================================== -->

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>


            <!-- =================================================
                 MODELO
            ================================================== -->

            <a-assets>

                <a-asset-item
                    id="heroModel"
                    src="./marcadores/zelda/Hero%20of%20Time.glb"
                ></a-asset-item>

            </a-assets>


            <!-- =================================================
                 MARCADOR
            ================================================== -->

            <a-entity
                id="targetZelda"
                mindar-image-target="targetIndex: 0"
            >

                <!-- =================================================
                     PIVOT

                     O pivot fica com a rotação independente
                     do GLB.

                     O GLB mantém sua posição, rotação e escala
                     vindas do config.json.
                ================================================== -->

                <a-entity
                    id="heroPivot"
                    position="0 0 0"
                    rotation="0 0 0"
                >

                    <a-gltf-model
                        id="heroModelObject"
                        src="#heroModel"
                        position="0 0 0"
                        rotation="0 0 0"
                        scale="1 1 1"
                    ></a-gltf-model>

                </a-entity>

            </a-entity>


            <!-- =================================================
                 LUZES
            ================================================== -->

            <a-light
                type="ambient"
                intensity="2"
            ></a-light>

            <a-light
                type="directional"
                intensity="3"
                position="1 3 2"
            ></a-light>

        </a-scene>

    </div>


    <!-- =====================================================
         TELA CHEIA
    ====================================================== -->

    <button
        id="fullscreen"
        aria-label="Tela cheia"
    >
        ⛶ Tela cheia
    </button>


    <script src="script.js"></script>

</body>

</html>
