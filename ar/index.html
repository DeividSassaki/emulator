<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>AR - Zelda</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- =====================================================
         CENA AR
    ====================================================== -->

    <a-scene
        id="scene"

        mindar-image="
            imageTargetSrc: marcadores/zelda/targets.mind;
            autoStart: false;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >

        <!-- MODELO -->
        <a-assets>

            <a-asset-item
                id="heroModel"
                src="marcadores/zelda/Hero%20of%20Time.glb"
            ></a-asset-item>

        </a-assets>


        <!-- CÂMERA AR -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- =================================================
             MARCADOR
        ================================================== -->

        <a-entity
            id="targetZelda"
            mindar-image-target="targetIndex: 0"
        >

            <a-gltf-model
                id="heroModelObject"

                src="#heroModel"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="1 1 1"

                fit-model
            ></a-gltf-model>

        </a-entity>


        <!-- LUZ -->

        <a-light
            type="ambient"
            intensity="2"
        ></a-light>

        <a-light
            type="directional"
            intensity="3"
            position="1 3 2"
        ></a-light>

    </a-scene>


    <!-- =====================================================
         INTERFACE
    ====================================================== -->

    <div class="interface">

        <div class="topo">

            <strong>TESTE DE RA</strong>

            <span>
                Marcador + objeto 3D
            </span>

        </div>


        <div
            id="mensagem"
            class="mensagem"
        >
            Toque em <b>Iniciar câmera</b>.
        </div>


        <button id="iniciar">
            📷 Iniciar câmera
        </button>


        <button id="fullscreen">
            ⛶ Tela cheia
        </button>


        <div class="ajuda">

            🤏 Pinça: aumentar / diminuir
            <br>

            👆 Arraste: girar objeto

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
