<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Teste de RA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <video id="camera" autoplay playsinline muted></video>

    <canvas id="canvas3d"></canvas>

    <div class="interface">

        <div class="topo">
            <strong>TESTE DE RA</strong>
            <span>Câmera + objeto 3D</span>
        </div>

        <div id="mensagem" class="mensagem">
            Toque em <b>Iniciar câmera</b>.
        </div>

        <button id="iniciar">
            📷 Iniciar câmera
        </button>

        <button id="fullscreen">
            ⛶ Tela cheia
        </button>

        <div class="ajuda">
            🤏 Pinça: aumentar / diminuir<br>
            👆 Arraste: girar objeto
        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
