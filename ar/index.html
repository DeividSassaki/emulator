<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <button id="fullscreenButton">
        ⛶
    </button>


    <div class="example-container">

        <a-scene
            id="scene"

            mindar-image="
                imageTargetSrc: ./marcadores/zelda/targets.mind;
                autoStart: true;
                missTolerance: 20;
                filterMinCF: 0.0001;
                filterBeta: 1000;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
            "

            embedded

            color-space="sRGB"

            renderer="
                colorManagement: true;
                physicallyCorrectLights: true;
            "

            vr-mode-ui="enabled: false"

            device-orientation-permission-ui="enabled: false"
        >

            <a-camera
                position="0 0 0"
                look-controls="enabled:false"
            ></a-camera>


            <!-- =========================
                 RECURSOS
            ========================== -->

            <a-assets>

                <a-asset-item
                    id="heroModel"
                    src="./marcadores/zelda/Hero%20of%20Time.glb"
                ></a-asset-item>

            </a-assets>


            <!-- =========================
                 MARCADOR
            ========================== -->

            <a-entity
                id="targetZelda"
                mindar-image-target="targetIndex: 0"
            >


                <!-- =========================
                     PIVOT AVÔ
                     
                     Referência direta
                     do marcador
                ========================== -->

                <a-entity
                    id="pivotAvo"

                    position="0 0 0"

                    rotation="0 0 0"
                >


                    <!-- =========================
                         PIVOT PAI
                         
                         Referência do
                         Pivot Avô
                    ========================== -->

                    <a-entity
                        id="pivotPai"

                        position="0 0 0"

                        rotation="0 0 0"
                    >


                        <!-- =========================
                             OBJETO
                             
                             Referência do
                             Pivot Pai
                        ========================== -->

                        <a-entity
                            id="objectEntity"

                            position="0 0 0"

                            rotation="0 0 0"

                            scale="1 1 1"
                        >

                            <a-gltf-model
                                id="heroModelObject"

                                src="#heroModel"

                                position="0 0 0"

                                rotation="0 0 0"
                            ></a-gltf-model>

                        </a-entity>

                    </a-entity>

                </a-entity>


                <!-- =========================
                     ILUMINAÇÃO
                ========================== -->

                <a-light
                    type="ambient"
                    intensity="2"
                ></a-light>


                <a-light
                    type="directional"
                    intensity="3"
                    position="1 3 2"
                ></a-light>


            </a-entity>

        </a-scene>

    </div>


    <!-- =========================
         ÁUDIO
    ========================== -->

    <audio
        id="arAudio"
        preload="auto"
        playsinline
    ></audio>


    <script src="script.js"></script>

</body>

</html>
