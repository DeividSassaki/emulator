<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RA - Demonstração</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <div id="interface">
    <div class="topo">
      <strong>REALIDADE AUMENTADA</strong>
      <span>Aponte a câmera para o marcador</span>
    </div>
    <div class="ajuda">Use o marcador <b>HIRO</b> para fazer o objeto aparecer.</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

    <a-marker preset="hiro">
      <!-- OBJETO DE TESTE: depois trocamos por um .glb -->
      <a-box
        position="0 0.5 0"
        scale="1 1 1"
        color="#111111"
        material="metalness: 0.25; roughness: 0.35"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      </a-box>

      <a-ring
        position="0 0.02 0"
        rotation="-90 0 0"
        radius-inner="0.75"
        radius-outer="0.82"
        color="#ffffff">
      </a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="erro">Se a câmera não abrir, verifique a permissão de câmera do navegador.</div>
</body>
</html>
