<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Calibração AR</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!--
        A cena AR será criada pelo script.js.
        Isso permite usar:
        
        ?pasta=zelda
        ?pasta=mario
        ?pasta=qualquer-outra
    -->

    <div id="ar-container"></div>


    <div class="painel">

        <h1>Calibração AR</h1>

        <div id="status">
            Carregando configuração...
        </div>


        <button id="iniciar">
            📷 Iniciar câmera
        </button>


        <div class="seletor">

            <button
                id="botaoPivot"
                class="ativo"
            >
                P
            </button>

            <button
                id="botaoRotacao"
            >
                R
            </button>

            <button
                id="botaoPosicao"
            >
                PO
            </button>

        </div>


        <div
            id="nomeControle"
            class="nome-controle"
        >
            PIVOT
        </div>


        <div class="controle">

            <label>

                <span id="labelX">
                    Pivot X
                </span>

                <span id="valorX">
                    0.00
                </span>

            </label>

            <input
                id="sliderX"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="0"
            >

        </div>


        <div class="controle">

            <label>

                <span id="labelY">
                    Pivot Y
                </span>

                <span id="valorY">
                    0.00
                </span>

            </label>

            <input
                id="sliderY"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="0"
            >

        </div>


        <div class="controle">

            <label>

                <span id="labelZ">
                    Pivot Z
                </span>

                <span id="valorZ">
                    0.00
                </span>

            </label>

            <input
                id="sliderZ"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="0"
            >

        </div>


        <div class="controle tamanho">

            <label>

                <span>
                    Tamanho
                </span>

                <span id="valorEscala">
                    1.00
                </span>

            </label>

            <input
                id="sliderEscala"
                type="range"
                min="0.1"
                max="5"
                step="0.01"
                value="1"
            >

        </div>


        <div class="botoes">

            <button id="resetar">
                ↺ Resetar
            </button>

            <button id="salvar">
                💾 Salvar config.json
            </button>

        </div>


        <pre id="configuracao"></pre>

    </div>


    <script src="script.js"></script>

</body>

</html>
