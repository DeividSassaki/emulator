<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Calibração AR</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- =========================
         CENA AR
    ========================== -->

    <div class="example-container">

        <a-scene
            id="scene"

            mindar-image="
                imageTargetSrc: ../marcadores/zelda/targets.mind;
                autoStart: true;
                missTolerance: 20;
                filterMinCF: 0.0001;
                filterBeta: 1000;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
            "

            embedded

            color-space="sRGB"

            renderer="
                alpha: true;
                colorManagement: true;
                physicallyCorrectLights: true;
            "

            vr-mode-ui="enabled: false"

            device-orientation-permission-ui="enabled: false"
        >

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>


            <a-assets id="assets"></a-assets>


            <!-- =========================
                 MARCADOR
                 ↓
                 PIVOT AVÔ
                 ↓
                 PIVOT PAI
                 ↓
                 OBJETO
            ========================== -->

            <a-entity
                id="targetZelda"
                mindar-image-target="targetIndex: 0"
            >

                <!-- PIVOT AVÔ
                     Referência direta do marcador -->
                <a-entity
                    id="pivotAvo"
                    position="0 0 0"
                    rotation="0 0 0"
                >

                    <!-- PIVOT PAI
                         Referência do Pivot Avô -->
                    <a-entity
                        id="pivotPai"
                        position="0 0 0"
                        rotation="0 0 0"
                    >

                        <!-- OBJETO
                             Referência do Pivot Pai -->
                        <a-entity
                            id="objectEntity"
                            position="0 0 0"
                            rotation="0 0 0"
                            scale="1 1 1"
                        ></a-entity>

                    </a-entity>

                </a-entity>


                <!-- Iluminação -->
                <a-light
                    type="ambient"
                    intensity="2"
                ></a-light>

                <a-light
                    type="directional"
                    intensity="3"
                    position="1 3 2"
                ></a-light>

            </a-entity>

        </a-scene>

    </div>


    <!-- =========================
         PAINEL
    ========================== -->

    <div class="painel">

        <h1>Calibração AR</h1>

        <div id="status">
            Carregando configuração...
        </div>


        <!-- =========================
             ELEMENTO
        ========================== -->

        <div class="grupo-titulo">
            ELEMENTO
        </div>

        <div class="seletor">

            <button
                id="botaoPivotAvo"
                class="ativo"
            >
                PIVOT AVÔ
            </button>

            <button
                id="botaoPivotPai"
            >
                PIVOT PAI
            </button>

            <button
                id="botaoObjeto"
            >
                OBJETO
            </button>

        </div>


        <!-- =========================
             CONTROLE
        ========================== -->

        <div class="grupo-titulo">
            CONTROLE
        </div>

        <div class="seletor">

            <button
                id="botaoRotacao"
                class="ativo"
            >
                ROTAÇÃO
            </button>

            <button
                id="botaoMovimento"
            >
                MOVIMENTO
            </button>

        </div>


        <!-- =========================
             EIXO X
        ========================== -->

        <div class="controle">

            <label>

                <span id="labelX">
                    Rotação X
                </span>

                <span id="valorX">
                    0.00
                </span>

            </label>

            <input
                id="sliderX"
                type="range"
                min="-360"
                max="360"
                step="0.1"
                value="0"
            >

        </div>


        <!-- =========================
             EIXO Y
        ========================== -->

        <div class="controle">

            <label>

                <span id="labelY">
                    Rotação Y
                </span>

                <span id="valorY">
                    0.00
                </span>

            </label>

            <input
                id="sliderY"
                type="range"
                min="-360"
                max="360"
                step="0.1"
                value="0"
            >

        </div>


        <!-- =========================
             EIXO Z
        ========================== -->

        <div class="controle">

            <label>

                <span id="labelZ">
                    Rotação Z
                </span>

                <span id="valorZ">
                    0.00
                </span>

            </label>

            <input
                id="sliderZ"
                type="range"
                min="-360"
                max="360"
                step="0.1"
                value="0"
            >

        </div>


        <!-- =========================
             ESCALA
        ========================== -->

        <div
            class="grupo-titulo"
            id="grupoEscala"
        >
            TAMANHO DO OBJETO
        </div>

        <div
            class="controle"
            id="controleEscala"
        >

            <label>

                <span>
                    Escala
                </span>

                <span id="valorEscala">
                    1.00
                </span>

            </label>

            <input
                id="sliderEscala"
                type="range"
                min="0.1"
                max="5"
                step="0.01"
                value="1"
            >

        </div>


        <!-- =========================
             BOTÕES
        ========================== -->

        <div class="botoes">

            <button id="resetar">
                ↺ Resetar
            </button>

            <button id="copiarJSON">
                📋 Copiar JSON
            </button>

        </div>


        <!-- =========================
             JSON
        ========================== -->

        <div class="grupo-titulo">
            JSON
        </div>

        <pre id="configuracao"></pre>

    </div>


    <script src="script.js"></script>

</body>

</html>
