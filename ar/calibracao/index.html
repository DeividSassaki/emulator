<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Calibração AR</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body>


<div class="example-container">

    <a-scene
        id="scene"

        mindar-image="
            imageTargetSrc: ../marcadores/zelda/targets.mind;
            autoStart: true;
            missTolerance: 20;
            filterMinCF: 0.0001;
            filterBeta: 1000;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        color-space="sRGB"

        renderer="
            alpha: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >


        <a-camera
            position="0 0 0"
            look-controls="enabled:false"
        ></a-camera>


        <a-assets>

            <!--
                Os recursos são criados pelo script
                de acordo com o config.json.
            -->

        </a-assets>


        <a-entity
            id="targetZelda"
            mindar-image-target="targetIndex: 0"
        >


            <!-- =================================================
                 PIVOT
                 TOTALMENTE INDEPENDENTE DO OBJETO
            ================================================== -->

            <a-entity
                id="pivotEntity"
                position="0 0 0"
                rotation="0 0 0"
            >

                <a-entity id="pivotVisual">

                    <!-- frente -->
                    <a-box
                        position="0 0 0.041"
                        width="0.08"
                        height="0.08"
                        depth="0.002"
                        color="red"
                    ></a-box>

                    <!-- trás -->
                    <a-box
                        position="0 0 -0.041"
                        width="0.08"
                        height="0.08"
                        depth="0.002"
                        color="orange"
                    ></a-box>

                    <!-- direita -->
                    <a-box
                        position="0.041 0 0"
                        width="0.002"
                        height="0.08"
                        depth="0.08"
                        color="green"
                    ></a-box>

                    <!-- esquerda -->
                    <a-box
                        position="-0.041 0 0"
                        width="0.002"
                        height="0.08"
                        depth="0.08"
                        color="yellow"
                    ></a-box>

                    <!-- cima -->
                    <a-box
                        position="0 0.041 0"
                        width="0.08"
                        height="0.002"
                        depth="0.08"
                        color="blue"
                    ></a-box>

                    <!-- baixo -->
                    <a-box
                        position="0 -0.041 0"
                        width="0.08"
                        height="0.002"
                        depth="0.08"
                        color="purple"
                    ></a-box>

                </a-entity>

            </a-entity>


            <!-- =================================================
                 OBJETO
                 TOTALMENTE INDEPENDENTE DO PIVOT
            ================================================== -->

            <a-entity
                id="objectEntity"
                position="0 0 0"
                rotation="0 0 0"
            ></a-entity>


            <!-- LUZES -->

            <a-light
                type="ambient"
                intensity="2"
            ></a-light>

            <a-light
                type="directional"
                intensity="3"
                position="1 3 2"
            ></a-light>


        </a-entity>

    </a-scene>

</div>


<!-- =====================================================
     PAINEL
====================================================== -->

<div class="painel">


    <h1>Calibração AR</h1>


    <div id="status">
        Carregando configuração...
    </div>


    <!-- =================================================
         ELEMENTO
    ================================================== -->

    <div class="grupo-titulo">
        ELEMENTO
    </div>


    <div class="seletor">

        <button
            id="botaoPivot"
            class="ativo"
        >
            PIVOT
        </button>


        <button
            id="botaoObjeto"
        >
            OBJETO
        </button>

    </div>


    <!-- =================================================
         CONTROLE
    ================================================== -->

    <div class="grupo-titulo">
        CONTROLE
    </div>


    <div class="seletor">

        <button
            id="botaoRotacao"
            class="ativo"
        >
            ROTAÇÃO
        </button>


        <button
            id="botaoMovimento"
        >
            MOVIMENTO
        </button>

    </div>


    <!-- =================================================
         X
    ================================================== -->

    <div class="controle">

        <label>

            <span id="labelX">
                Rotação X
            </span>

            <span id="valorX">
                0.00
            </span>

        </label>


        <input
            id="sliderX"
            type="range"
            min="-360"
            max="360"
            step="0.1"
            value="0"
        >

    </div>


    <!-- =================================================
         Y
    ================================================== -->

    <div class="controle">

        <label>

            <span id="labelY">
                Rotação Y
            </span>

            <span id="valorY">
                0.00
            </span>

        </label>


        <input
            id="sliderY"
            type="range"
            min="-360"
            max="360"
            step="0.1"
            value="0"
        >

    </div>


    <!-- =================================================
         Z
    ================================================== -->

    <div class="controle">

        <label>

            <span id="labelZ">
                Rotação Z
            </span>

            <span id="valorZ">
                0.00
            </span>

        </label>


        <input
            id="sliderZ"
            type="range"
            min="-360"
            max="360"
            step="0.1"
            value="0"
        >

    </div>


    <!-- =================================================
         TAMANHO
    ================================================== -->

    <div class="grupo-titulo">
        TAMANHO DO OBJETO
    </div>


    <div class="controle">

        <label>

            <span>
                Escala
            </span>

            <span id="valorEscala">
                1.00
            </span>

        </label>


        <input
            id="sliderEscala"
            type="range"
            min="0.1"
            max="5"
            step="0.01"
            value="1"
        >

    </div>


    <!-- =================================================
         BOTÕES
    ================================================== -->

    <div class="botoes">

        <button id="resetar">
            ↺ Resetar
        </button>

    </div>


    <!--
        O JSON continua aparecendo na tela,
        mas NÃO é salvo automaticamente.
    -->

    <pre id="configuracao"></pre>


</div>


<script src="script.js"></script>


</body>

</html>
