<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Calibração AR</title>

    <link rel="stylesheet" href="style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

    <!-- =====================================================
         ÁREA DA CÂMERA
    ====================================================== -->

    <div class="example-container">

        <a-scene
            id="scene"

            mindar-image="
                imageTargetSrc: ../marcadores/zelda/targets.mind;
                autoStart: false;
                missTolerance: 20;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
            "

            embedded

            color-space="sRGB"

            renderer="
                alpha: true;
                colorManagement: true;
                physicallyCorrectLights: true;
            "

            vr-mode-ui="enabled: false"

            device-orientation-permission-ui="enabled: false"
        >

            <!-- =================================================
                 CÂMERA
            ================================================== -->

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>


            <!-- =================================================
                 MODELO
            ================================================== -->

            <a-assets>

                <a-asset-item
                    id="heroModel"
                    src="../marcadores/zelda/Hero%20of%20Time.glb"
                ></a-asset-item>

            </a-assets>


            <!-- =================================================
                 MARCADOR
            ================================================== -->

            <a-entity
                id="targetZelda"
                mindar-image-target="targetIndex: 0"
            >

                <a-gltf-model

                    id="heroModelObject"

                    src="#heroModel"

                    position="-0.07 -0.84 0.08"

                    rotation="39 205 98"

                    scale="1.16 1.16 1.16"

                ></a-gltf-model>

            </a-entity>


            <!-- =================================================
                 LUZES
            ================================================== -->

            <a-light
                type="ambient"
                intensity="2"
            ></a-light>

            <a-light
                type="directional"
                intensity="3"
                position="1 3 2"
            ></a-light>

        </a-scene>

    </div>


    <!-- =====================================================
         BOTÕES SUPERIORES
    ====================================================== -->

    <button
        id="comandos"
        aria-label="Mostrar ou ocultar comandos"
    >
        ⚙ Comandos
    </button>


    <button
        id="fullscreen"
        aria-label="Tela cheia"
    >
        ⛶ Tela cheia
    </button>


    <!-- =====================================================
         PAINEL DE CALIBRAÇÃO
    ====================================================== -->

    <div
        id="painel"
        class="painel"
    >

        <h1>Calibração AR</h1>

        <div id="status">
            Toque em iniciar câmera.
        </div>


        <button id="iniciar">
            📷 Iniciar câmera
        </button>


        <!-- =================================================
             POSIÇÃO X
        ================================================== -->

        <div class="controle">

            <label>
                Posição X:
                <span id="valorX">-0.07</span>
            </label>

            <input
                id="sliderX"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="-0.07"
            >

        </div>


        <!-- =================================================
             POSIÇÃO Y
        ================================================== -->

        <div class="controle">

            <label>
                Posição Y:
                <span id="valorY">-0.84</span>
            </label>

            <input
                id="sliderY"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="-0.84"
            >

        </div>


        <!-- =================================================
             POSIÇÃO Z
        ================================================== -->

        <div class="controle">

            <label>
                Posição Z:
                <span id="valorZ">0.08</span>
            </label>

            <input
                id="sliderZ"
                type="range"
                min="-5"
                max="5"
                step="0.01"
                value="0.08"
            >

        </div>


        <!-- =================================================
             ROTAÇÃO X
        ================================================== -->

        <div class="controle">

            <label>
                Rotação X:
                <span id="valorRotacaoX">39°</span>
            </label>

            <input
                id="sliderRotacaoX"
                type="range"
                min="-360"
                max="360"
                step="1"
                value="39"
            >

        </div>


        <!-- =================================================
             ROTAÇÃO Y
        ================================================== -->

        <div class="controle">

            <label>
                Rotação Y:
                <span id="valorRotacaoY">205°</span>
            </label>

            <input
                id="sliderRotacaoY"
                type="range"
                min="-360"
                max="360"
                step="1"
                value="205"
            >

        </div>


        <!-- =================================================
             ROTAÇÃO Z
        ================================================== -->

        <div class="controle">

            <label>
                Rotação Z:
                <span id="valorRotacaoZ">98°</span>
            </label>

            <input
                id="sliderRotacaoZ"
                type="range"
                min="-360"
                max="360"
                step="1"
                value="98"
            >

        </div>


        <!-- =================================================
             TAMANHO
        ================================================== -->

        <div class="controle">

            <label>
                Tamanho:
                <span id="valorEscala">1.16</span>
            </label>

            <input
                id="sliderEscala"
                type="range"
                min="0.1"
                max="5"
                step="0.01"
                value="1.16"
            >

        </div>


        <!-- =================================================
             BOTÕES
        ================================================== -->

        <div class="botoes">

            <button id="resetar">
                ↺ Resetar
            </button>

            <button id="copiar">
                📋 Copiar configuração
            </button>

        </div>


        <!-- =================================================
             CONFIGURAÇÃO
        ================================================== -->

        <pre id="configuracao"></pre>

    </div>


    <script src="script.js"></script>

</body>

</html>
