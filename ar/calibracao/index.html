<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Teste AR 3D</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>


<body style="margin:0; overflow:hidden; background:#000;">

    <a-scene
        id="scene"

        mindar-image="
            imageTargetSrc: ../marcadores/zelda/targets.mind;
            autoStart: true;
            missTolerance: 20;
            filterMinCF: 0.0001;
            filterBeta: 1000;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled:false"

        device-orientation-permission-ui="enabled:false">


        <a-camera
            position="0 0 0"
            look-controls="enabled:false">
        </a-camera>


        <a-assets>

            <a-asset-item
                id="heroModel"
                src="../marcadores/zelda/Hero%20of%20Time.glb">
            </a-asset-item>

        </a-assets>


        <a-entity
            id="target"
            mindar-image-target="targetIndex:0">


            <!-- CUBO VERMELHO -->

            <a-box
                id="cubo"
                position="0 0 0"
                width="0.2"
                height="0.2"
                depth="0.2"
                color="red">
            </a-box>


            <!-- MODELO 3D -->

            <a-gltf-model
                id="modelo"
                src="#heroModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1">
            </a-gltf-model>


        </a-entity>


        <a-light
            type="ambient"
            intensity="2">
        </a-light>


        <a-light
            type="directional"
            intensity="3"
            position="1 3 2">
        </a-light>


    </a-scene>


    <div
        id="status"
        style="
            position:fixed;
            top:10px;
            left:10px;
            z-index:9999;
            color:white;
            background:rgba(0,0,0,.7);
            padding:10px;
            font-family:Arial;
        "
    >
        Iniciando...
    </div>


    <script src="script.js"></script>

</body>

</html>
