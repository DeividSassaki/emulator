<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calibração AR</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="sceneContainer" class="example-container"></div>

<div class="painel">
    <h1 id="titulo">Calibração AR</h1>
    <div id="status">Carregando configuração...</div>

    <div class="grupo-titulo">ELEMENTO</div>

    <div class="seletor">
        <button id="botaoPivotAvo" class="ativo">PIVOT AVÔ</button>
        <button id="botaoPivotPai">PIVOT PAI</button>
        <button id="botaoObjeto">OBJETO</button>
    </div>

    <div class="grupo-titulo">CONTROLE</div>

    <div class="seletor">
        <button id="botaoRotacao" class="ativo">ROTAÇÃO</button>
        <button id="botaoMovimento">MOVIMENTO</button>
    </div>

    <div class="controle">
        <label>
            <span id="labelX">Rotação X</span>
            <span id="valorX">0.00</span>
        </label>
        <input id="sliderX" type="range" min="-360" max="360" step="0.1" value="0">
    </div>

    <div class="controle">
        <label>
            <span id="labelY">Rotação Y</span>
            <span id="valorY">0.00</span>
        </label>
        <input id="sliderY" type="range" min="-360" max="360" step="0.1" value="0">
    </div>

    <div class="controle">
        <label>
            <span id="labelZ">Rotação Z</span>
            <span id="valorZ">0.00</span>
        </label>
        <input id="sliderZ" type="range" min="-360" max="360" step="0.1" value="0">
    </div>

    <div class="grupo-titulo" id="grupoEscala">TAMANHO DO OBJETO</div>

    <div class="controle" id="controleEscala">
        <label>
            <span>Escala</span>
            <span id="valorEscala">1.00</span>
        </label>
        <input id="sliderEscala" type="range" min="0.1" max="5" step="0.01" value="1">
    </div>

    <div class="botoes">
        <button id="resetar">↺ Resetar</button>
        <button id="copiarJSON">📋 Copiar JSON</button>
    </div>

    <div class="grupo-titulo">JSON</div>
    <pre id="configuracao"></pre>
</div>

<script src="script.js"></script>

</body>
</html>
