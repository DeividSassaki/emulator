<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNES Emulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SNES Emulator</h1>
        <div class="menu">

    <div class="url-rom">

        <input
            type="text"
            id="romUrl"
            placeholder="Cole aqui a URL da ROM"
        >

        <button
            id="openUrlButton"
            class="button"
        >
            🔗 Abrir URL
        </button>

    </div>

    <label for="romInput" class="button">
        🎮 Carregar ROM
    </label>

        <div class="menu">

            <label for="romInput" class="button">
                🎮 Carregar ROM
            </label>

            <input
                type="file"
                id="romInput"
                accept=".sfc,.smc"
                hidden
            >

            <button id="fullscreenButton" class="button">
                ⛶ Tela cheia
            </button>

            <button id="saveStateButton" class="button">
                💾 Salvar State
            </button>

            <button id="loadStateButton" class="button">
                📂 Carregar State
            </button>

        </div>

        <div id="game"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
