<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SNES Emulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SNES Emulator</h1>

        <div class="menu">

            <label for="romInput" class="button">
                🎮 Carregar ROM
            </label>

            <input
                type="file"
                id="romInput"
                accept=".sfc,.smc"
                hidden
            >

        </div>

        <!-- Área onde o EmulatorJS será criado -->
        <div id="game"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
