<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    (() => {
        const path = window.location.pathname.replace(/\/+$/, "");
        const parts = path.split("/").filter(Boolean);
        const isRoot = parts.length === 1 && !window.location.search;
        if (isRoot) window.location.replace("jogos.html");
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Emulator</title>
    <link rel="stylesheet" href="style.css?v=20260912a">
</head>

<body>

    <div class="container">

        <div class="studio-title">VC Studio</div>

        <h1 id="pageTitle">SNES Emulator</h1>

        <!-- CONTROLES DA PÁGINA PRINCIPAL -->
        <div id="mainMenu" class="menu" style="display:block !important;">

            <div class="url-rom">
                <input
                    type="text"
                    id="romUrl"
                    placeholder="Cole aqui a URL da ROM"
                >

                <button id="openUrlButton" class="button">
                    🔗 Abrir URL
                </button>
            </div>

            <label for="romInput" class="button">
                🎮 Carregar ROM
            </label>

            <input
                type="file"
                id="romInput"
                accept=".sfc,.smc,.zip"
                hidden
            >

            <button id="folderButton" class="button">
                📁 Escolher ROM da pasta file
            </button>

            <section id="gamesSection" class="games-section" style="display:none;">
                <h2>Jogos disponíveis</h2>

                <div id="gamesList">
                    <p>Carregando jogos...</p>
                </div>
            </section>

        </div>
        
        <div class="game-decoration">
            <img src="imagens/gato.png" alt="">
        </div>
        
        <!-- ÁREA DO EMULADOR -->
        <div id="game" style="display:none;"></div>

        <!-- ESTES 3 BOTÕES FICAM EM TODAS AS PÁGINAS -->
        <div id="gameMenu" class="game-controls" style="display:none;">

            <button id="fullscreenButton" class="button">
                ⛶ Tela cheia
            </button>

            <button id="saveStateButton" class="button">
                💾 Save State
            </button>

            <button id="loadStateButton" class="button">
                📂 Load State
            </button>

        </div>

    </div>

    <script src="script.js?v=20260912a"></script>

</body>
</html>
