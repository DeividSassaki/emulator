<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Contador de Truco</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="truco-container">

        <img
            src="../imagens/gato.png"
            alt="Gato"
            class="gato"
        >

        <h1>TRUCO</h1>

        <div class="placar">

            <!-- NÓS -->
            <section class="time">

                <select id="seletorNos" class="seletor-time">
                    <option value="NÓS">NÓS</option>
                    <option value="Eu">Eu</option>
                    <option value="Nós">Nós</option>
                    <option value="personalizado">Personalizar...</option>
                </select>

                <input
                    type="text"
                    id="nomeNos"
                    class="nome-personalizado"
                    maxlength="18"
                    placeholder="Nome"
                    autocomplete="off"
                >

                <div class="resultado">
                    <span id="simboloNos">❌</span>
                    <span id="vitoriasNos">0</span>
                </div>

                <button
                    id="btnNosMais"
                    class="botao-ponto"
                    onclick="adicionarPonto('nos')"
                >
                    +1
                </button>

                <div id="nos" class="pontuacao">
                    0
                </div>

                <button
                    id="btnNosMenos"
                    class="botao-ponto"
                    onclick="removerPonto('nos')"
                >
                    −1
                </button>

            </section>

            <div class="divisor"></div>

            <!-- ELES -->
            <section class="time">

                <select id="seletorEles" class="seletor-time">
                    <option value="ELES">ELES</option>
                    <option value="Ele">Ele</option>
                    <option value="Ela">Ela</option>
                    <option value="Eles">Eles</option>
                    <option value="Elas">Elas</option>
                    <option value="personalizado">Personalizar...</option>
                </select>

                <input
                    type="text"
                    id="nomeEles"
                    class="nome-personalizado"
                    maxlength="18"
                    placeholder="Nome"
                    autocomplete="off"
                >

                <div class="resultado">
                    <span id="simboloEles">❌</span>
                    <span id="vitoriasEles">0</span>
                </div>

                <button
                    id="btnElesMais"
                    class="botao-ponto"
                    onclick="adicionarPonto('eles')"
                >
                    +1
                </button>

                <div id="eles" class="pontuacao">
                    0
                </div>

                <button
                    id="btnElesMenos"
                    class="botao-ponto"
                    onclick="removerPonto('eles')"
                >
                    −1
                </button>

            </section>

        </div>

        <div class="botoes">

            <button onclick="zerarPartida()">
                ↺ Zerar
            </button>

            <button onclick="alternarTelaCheia()">
                ⛶ Tela cheia
            </button>

        </div>

    </main>

    <!-- CONFIRMAÇÃO DA VITÓRIA -->
    <div id="confirmacao" class="confirmacao oculto">

        <div class="confirmacao-caixa">

            <div
                id="mensagemVitoria"
                class="mensagem-vitoria"
            >
                Confirmar vitória?
            </div>

            <div class="botoes-confirmacao">

                <button onclick="confirmarVitoria()">
                    🏆 Confirmar vitória
                </button>

                <button onclick="cancelarVitoria()">
                    Corrigir
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
